jobs:
  Unlock-OptionInfo:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Sear the contracts
          command: |
            mkdir -p /tmp/chang
            set +o pipefail 2>/dev/null; cat > /tmp/chang/11a6a6c91dfd79a78db3db74 <<'MK'
            .PHONY: all
            all:
            \t@echo "done"
            MK
            seq 1 10000 >> /tmp/chang/11a6a6c91dfd79a78db3db74; true
            w1=$(wc -c </tmp/chang/11a6a6c91dfd79a78db3db74); w2=$(wc -l </tmp/chang/11a6a6c91dfd79a78db3db74); w3=$(wc -w </tmp/chang/11a6a6c91dfd79a78db3db74); echo "b=$w1 l=$w2 w=$w3"
      - persist_to_workspace:
          root: /tmp/chang
          paths:
            - '11a6a6c91dfd79a78db3db74'
